  a.linklike{color:var(--gold);text-decoration:underline;cursor:pointer;background:none;border:none;font-family:var(--mono);font-size:12px;padding:0;width:auto;display:inline;}

  ol.setup li{margin-bottom:10px;font-size:13px;line-height:1.6;color:var(--paper);}

<body>
<div id="app"></div>
<script>
/* =========================================================
   GITHUB CONFIG — REPLACE BEFORE HOSTING
   Credentials are now entered on the page itself when you open it -- NOT
   hardcoded here. That's on purpose: a real token committed into a public
   repo gets auto-revoked by GitHub's secret scanning within minutes. Typing
   it in at runtime means it only ever lives in your browser tab's memory,
   never in git history.
   ========================================================= */

const GITHUB_OWNER  = "ExtianIgop";
const GITHUB_REPO   = "SPY";
const GITHUB_BRANCH = "main";
let gh = null; // {token} -- set via the Connect screen, never persisted or committed

const WORDS = [
  "Paliparan","Palengke","Simbahan","Paaralan","Ospital","Restawran","Dalampasigan","Sinehan",
  "Estasyon ng Tren","Bangko","Botika","Barberya","Bahay Kubo","Sari-Sari Store",
  "Terminal ng Jeepney","Palaisdaan","Plasa ng Bayan","Barangay Hall","Videoke Bar","Talipapa",
  "Casino","Cruise Ship","Space Station","Submarine","Military Base","Movie Studio",
  "Art Museum","Ski Resort","Pirate Ship","Wedding Venue"
]; // Rough Tagalog translations -- worth a native-speaker double check before relying on them.

// Shown only to the mole: one decoy word, close enough to feel plausible but
// genuinely wrong -- gives the mole a false sense of almost knowing the answer.
// Kept in the same language as the real word so the mismatch itself isn't a tell.
const NEAR_MISS = {
  "Paliparan":"Estasyon ng Tren", "Palengke":"Talipapa", "Simbahan":"Kapilya",
  "Paaralan":"Dalubhasaan", "Ospital":"Klinika", "Restawran":"Kapihan",
  "Dalampasigan":"Resort sa Bundok", "Sinehan":"Teatro", "Estasyon ng Tren":"Terminal ng Bus",
  "Bangko":"Opisina ng Koreo", "Botika":"Sari-Sari Store", "Barberya":"Salon",
  "Bahay Kubo":"Bahay na Bato", "Sari-Sari Store":"Palengke", "Terminal ng Jeepney":"Terminal ng Bus",
  "Palaisdaan":"Sakahan", "Plasa ng Bayan":"Bulwagang Bayan", "Barangay Hall":"Munisipyo",
  "Videoke Bar":"Disco", "Talipapa":"Palengke",
  "Casino":"Nightclub", "Cruise Ship":"Ferry Terminal", "Space Station":"Space Shuttle",
  "Submarine":"Cargo Ship", "Military Base":"Police Academy", "Movie Studio":"TV Studio",
  "Art Museum":"History Museum", "Ski Resort":"Ice Rink", "Pirate Ship":"Fishing Trawler",
  "Wedding Venue":"Reception Hall"
};

function genId(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);}
function genCode(){ const chars='ABCDEFGHJKLMNPQRSTUVWXYZ'; let c='';for(let i=0;i<4;i++)c+=chars[Math.floor(Math.random()*chars.length)]; return c; }
function fmtClock(ms){ if(ms<0)ms=0; const s=Math.floor(ms/1000); const m=Math.floor(s/60); const r=s%60; return String(m).padStart(2,'0')+':'+String(r).padStart(2,'0'); }
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function b64EncodeUnicode(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64DecodeUnicode(str){ return decodeURIComponent(escape(atob(str.replace(/\n/g,'')))); }
function apiBase(){ return `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/`; }

/* ---------- GitHub Contents API helpers ---------- */
async function ghGetFile(path){
  const res = await fetch(apiBase()+path+`?ref=${GITHUB_BRANCH}&t=${Date.now()}`, {
    headers: { Authorization: `Bearer ${gh.token}`, Accept: 'application/vnd.github+json' }
  });
  if(res.status===404) return {json:null, sha:null};
  if(!res.ok) throw new Error('GitHub API error '+res.status+': '+(await res.text()).slice(0,200));
  const data = await res.json();
  return { json: JSON.parse(b64DecodeUnicode(data.content)), sha: data.sha };
}

async function ghPutFile(path, obj, sha, message){
  const body = {
    message: message || ('update '+path),
    content: b64EncodeUnicode(JSON.stringify(obj)),
    branch: GITHUB_BRANCH
  };
  if(sha) body.sha = sha;
  const res = await fetch(apiBase()+path, {
    method:'PUT',
    headers: { Authorization: `Bearer ${gh.token}`, Accept:'application/vnd.github+json', 'Content-Type':'application/json' },
    body: JSON.stringify(body)
  });
  if(res.status===409){ const e=new Error('conflict'); e.conflict=true; throw e; }
  if(!res.ok) throw new Error('GitHub API error '+res.status+': '+(await res.text()).slice(0,200));
  return await res.json();
}

async function ghMutate(path, mutatorFn, opts={}){
  const createIfMissing = opts.createIfMissing !== false;
  let lastErr = null;
  for(let attempt=0; attempt<6; attempt++){
    let current, sha;
    try{ const r = await ghGetFile(path); current = r.json; sha = r.sha; }
    catch(e){ lastErr=e; await sleep(300+attempt*200); continue; }
    if(current===null && !createIfMissing) return null;
    const next = mutatorFn(current);
    if(next===null || next===undefined) return null;
    try{
      await ghPutFile(path, next, sha, opts.message);
      return next;
    } catch(e){
      if(e.conflict){ await sleep(250+attempt*200); continue; }
      throw e;
    }
  }
  throw lastErr || new Error('Could not write after several attempts (repo may be busy).');
}
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
const roomPath = code => `data/room-${code}.json`;

/* ---------- state ---------- */
const myId = genId();
let state = {
  screen:'connect', name:'', code:'', isHost:false, discussionMinutes:5,
  game:null, roster:[], revealed:false, myVote:null, votesCount:0, toast:null
};
let tallyCache = {tally:{}, total:0};

function setToast(msg){ state.toast=msg; render(); setTimeout(()=>{ if(state.toast===msg){state.toast=null; render();} },3600); }

function freshRoom(hostName){
  return {
    status:'lobby', hostId:myId, hostName, round:0,
    discussionMs: state.discussionMinutes*60000, players:[], word:null, spyId:null,
    startTime:null, votingStartTime:null, turnIndex:0, chat:{},
    roster:{}, votes:{}
  };
}

async function createRoom(){
  if(!state.name.trim()){ setToast('Enter your name first.'); return; }
  let code = genCode();
  try{
    let existing = await ghGetFile(roomPath(code));
    let tries=0;
    while(existing.json && tries<5){ code=genCode(); existing=await ghGetFile(roomPath(code)); tries++; }
    const room = freshRoom(state.name.trim());
    room.roster[myId] = {id:myId, name:state.name.trim()};
    await ghMutate(roomPath(code), ()=>room, {message:'Open case file '+code});
  } catch(e){
    setToast('Could not reach GitHub: '+e.message);
    return;
  }
  state.code = code; state.isHost = true; state.screen='lobby';
  render();
}

async function joinRoom(codeInput){
  const code = codeInput.trim().toUpperCase();
  if(!state.name.trim()){ setToast('Enter your name first.'); return; }
  if(!code){ setToast('Enter a case file code.'); return; }
  let existing;
  try{ existing = await ghGetFile(roomPath(code)); }
  catch(e){ setToast('Could not reach GitHub: '+e.message); return; }
  if(!existing.json){ setToast('No case file found with that code.'); return; }
  try{
    const updated = await ghMutate(roomPath(code), current=>{
      current.roster[myId] = {id:myId, name:state.name.trim()};
      return current;
    }, {message:'Agent joins '+code, createIfMissing:false});
    state.game = updated;
  } catch(e){ setToast('Could not join: '+e.message); return; }
  state.code = code; state.isHost = (state.game.hostId===myId);
  enterRoundScreen(state.game);
}

function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function pickSpyAndWord(playersArr, avoidWord){
  const spy = playersArr[Math.floor(Math.random()*playersArr.length)];
  const pool = WORDS.filter(w=>w!==avoidWord);
  const word = pool[Math.floor(Math.random()*pool.length)];
  return {spyId:spy.id, word};
}

async function startGame(){
  if(!state.isHost) return;
  try{
    const updated = await ghMutate(roomPath(state.code), current=>{
      const entries = Object.values(current.roster||{});
      if(entries.length<3){ setToast('Need at least 3 agents to start.'); return null; }
      const {spyId,word} = pickSpyAndWord(entries, null);
      current.status='briefing'; current.round=(current.round||0)+1;
      current.players = entries.map(e=>({id:e.id,name:e.name}));
      current.discussionMs = state.discussionMinutes*60000;
      current.word=word; current.spyId=spyId;
      current.startTime=Date.now(); current.votingStartTime=null;
      current.turnIndex=0; current.speakingOrder=shuffleArray(current.players.map(p=>p.id)); current.chat=current.chat||{}; current.chat[current.round]=[];
      return current;
    }, {message:'Start round '+state.code});
    if(updated){ state.game=updated; state.revealed=false; state.myVote=null; state.votedRound=null; enterRoundScreen(updated); }
  } catch(e){ setToast('Could not start round: '+e.message); }
}

async function newRound(){
  if(!state.isHost) return;
  try{
    const updated = await ghMutate(roomPath(state.code), current=>{
      const entries = Object.values(current.roster||{});
      if(entries.length<3){ setToast('Need at least 3 agents to start.'); return null; }
      const {spyId,word} = pickSpyAndWord(entries, current.word);
      current.status='briefing'; current.round=(current.round||0)+1;
      current.players = entries.map(e=>({id:e.id,name:e.name}));
      current.word=word; current.spyId=spyId;
      current.startTime=Date.now(); current.votingStartTime=null;
      current.turnIndex=0; current.speakingOrder=shuffleArray(current.players.map(p=>p.id)); current.chat=current.chat||{}; current.chat[current.round]=[];
      return current;
    }, {message:'New round '+state.code});
    if(updated){ state.game=updated; state.revealed=false; state.myVote=null; state.votedRound=null; enterRoundScreen(updated); }
  } catch(e){ setToast('Could not start round: '+e.message); }
}

async function backToLobby(){
  if(!state.isHost) return;
  try{
    const updated = await ghMutate(roomPath(state.code), current=>{ current.status='lobby'; return current; }, {message:'Back to lobby '+state.code});
    state.game=updated; state.screen='lobby'; render();
  } catch(e){ setToast('Could not update: '+e.message); }
}

async function startVoting(){
  if(!state.isHost) return;
  try{
    const updated = await ghMutate(roomPath(state.code), current=>{ current.status='voting'; current.votingStartTime=Date.now(); return current; }, {message:'Start voting '+state.code});
    state.game=updated; enterRoundScreen(updated);
  } catch(e){ setToast('Could not update: '+e.message); }
}

function selectSuspect(suspectId){
  if(state.votedRound===state.game.round) return; // already submitted, locked
  state.myVote = suspectId;
  render();
}

async function submitVote(){
  if(!state.myVote){ setToast('Pick someone before submitting.'); return; }
  const round = state.game.round;
  const suspectId = state.myVote;
  try{
    await ghMutate(roomPath(state.code), current=>{
      current.votes[round] = current.votes[round] || {};
      current.votes[round][myId] = suspectId;
      return current;
    }, {message:'Vote cast '+state.code});
    state.votedRound = round;
    render();
  } catch(e){ setToast('Could not save your vote: '+e.message); }
}

function handleSendChat(){
  const input = document.getElementById('chatInput');
  if(!input || input.disabled) return;
  const text = input.value.trim();
  if(!text) return;
  input.value = '';
  sendChatMessage(text);
}

function currentSpeaker(g){
  const players = g.players || [];
  if(players.length===0) return null;
  const order = (g.speakingOrder && g.speakingOrder.length===players.length) ? g.speakingOrder : players.map(p=>p.id);
  const idx = (g.turnIndex||0) % order.length;
  const speakerId = order[idx];
  return players.find(p=>p.id===speakerId) || players[idx];
}

async function sendChatMessage(text){
  try{
    const updated = await ghMutate(roomPath(state.code), current=>{
      const players = current.players || [];
      if(players.length===0) return null;
      const order = (current.speakingOrder && current.speakingOrder.length===players.length) ? current.speakingOrder : players.map(p=>p.id);
      const idx = (current.turnIndex||0) % order.length;
      const speakerId = order[idx];
      if(speakerId !== myId) return null; // not actually their turn — abort silently
      const speaker = players.find(p=>p.id===speakerId);
      const round = current.round;
      current.chat = current.chat || {};
      current.chat[round] = current.chat[round] || [];
      current.chat[round].push({id:genId(), senderId:myId, senderName:speaker.name, text, ts:Date.now()});
      current.turnIndex = idx+1;
      return current;
    }, {message:'Chat message '+state.code});
    if(updated){ state.game = updated; patchOrRender(); }
    else { setToast("It's not your turn to speak."); }
  } catch(e){ setToast('Could not send: '+e.message); }
}

async function revealResults(){
  if(!state.isHost) return;
  try{
    const updated = await ghMutate(roomPath(state.code), current=>{ current.status='results'; return current; }, {message:'Reveal results '+state.code});
    state.game=updated; enterRoundScreen(updated);
  } catch(e){ setToast('Could not update: '+e.message); }
}

function enterRoundScreen(g){
  if(g.status==='briefing') state.screen='briefing';
  else if(g.status==='voting'){
    state.screen='voting';
    const roundVotes = (g.votes && g.votes[g.round]) || {};
    state.votesCount = Object.values(roundVotes).length;
  }
  else if(g.status==='results') state.screen='results';
  else state.screen='lobby';
  render();
}

/* ---------- polling ---------- */
let lastGameSnapshot = null;

async function tick(){
  if(state.screen==='home' || state.screen==='connect' || !state.code) return;
  let g;
  try{ const r = await ghGetFile(roomPath(state.code)); g = r.json; }
  catch(e){ setToast('Lost contact with GitHub: '+e.message); return; }
  if(!g) return;

  const snapshot = JSON.stringify(g);
  const unchanged = (snapshot === lastGameSnapshot);

  state.game = g;
  state.isHost = (g.hostId===myId);
  state.roster = Object.values(g.roster||{}).sort((a,b)=>a.name.localeCompare(b.name));

  if(g.status!==state.screen){
    lastGameSnapshot = snapshot;
    if(g.status==='briefing'){ state.revealed=false; state.myVote=null; state.votedRound=null; }
    enterRoundScreen(g);
    return;
  }

  if(state.screen==='briefing'){
    const elapsed = Date.now()-g.startTime;
    if(elapsed>=g.discussionMs && state.isHost){ lastGameSnapshot=snapshot; await startVoting(); return; }
  }

  if(state.screen==='voting'){
    const roundVotes = (g.votes && g.votes[g.round]) || {};
    const entries = Object.values(roundVotes);
    state.votesCount = entries.length;
    if(state.isHost && g.players && entries.length>=g.players.length && g.players.length>0){
      lastGameSnapshot=snapshot; await revealResults(); return;
    }
  }

  if(state.screen==='results'){
    const roundVotes = (g.votes && g.votes[g.round]) || {};
    const entries = Object.values(roundVotes);
    const tally={};
    entries.forEach(v=>{ tally[v]=(tally[v]||0)+1; });
    tallyCache = {tally, total: entries.length};
  }

  if(unchanged) return; // nothing actually changed -- skip the re-render entirely
  lastGameSnapshot = snapshot;
  patchOrRender();
}
setInterval(tick, 5000);
setInterval(()=>{
  if(state.screen==='briefing' && state.game && state.game.startTime){
    const el = document.getElementById('liveclock');
    if(el){
      const remain = state.game.startTime + state.game.discussionMs - Date.now();
      el.textContent = fmtClock(remain);
      if(remain<=0 && state.isHost){ startVoting(); }
    }
  }
},1000);

/* ---------- render ---------- */
function renderChatHistory(g){
  const messages = (g.chat && g.chat[g.round]) || [];
  return `
    <div class="card">
      <label>Round Table &mdash; What Was Said</label>
      <div class="chatlog">
        ${messages.length ? messages.map(m=>`<div class="chatmsg"><span class="sender">${esc(m.senderName)}:</span> ${esc(m.text)}</div>`).join('')
                           : '<div class="hint">No one said anything this round.</div>'}
      </div>
    </div>
  `;
}

function chatMessagesHTML(messages){
  return messages.length ? messages.slice(-30).map(m=>`<div class="chatmsg"><span class="sender">${esc(m.senderName)}:</span> ${esc(m.text)}</div>`).join('')
                         : '<div class="hint">No one has spoken yet.</div>';
}

function renderChat(g){
  const players = g.players || [];
  if(players.length===0) return '';
  const round = g.round;
  const messages = (g.chat && g.chat[round]) || [];
  const turnPlayer = currentSpeaker(g);
  const myTurn = turnPlayer && turnPlayer.id===myId;
  return `
    <div class="card" id="roundTableCard">
      <label>Round Table</label>
      <div class="chatlog" id="chatLog">${chatMessagesHTML(messages)}</div>
      <div class="hint" id="turnStatus" style="margin-bottom:8px;">${myTurn ? "It's your turn to speak." : `Waiting on ${esc(turnPlayer?turnPlayer.name:'')}&hellip;`}</div>
      <div class="row">
        <input type="text" id="chatInput" placeholder="${myTurn?'Say something…':'Not your turn'}" maxlength="240" ${myTurn?'':'disabled'}>
        <button class="btn-primary" id="chatSendBtn" style="flex:0 0 84px;" ${myTurn?'':'disabled'}>Send</button>
      </div>
    </div>
  `;
}

function patchChatUI(g){
  const chatLogEl = document.getElementById('chatLog');
  if(!chatLogEl) return false; // briefing screen not actually on-DOM yet -- caller should fall back to full render
  const round = g.round;
  const messages = (g.chat && g.chat[round]) || [];
  const turnPlayer = currentSpeaker(g);
  const myTurn = turnPlayer && turnPlayer.id===myId;

  const wasNearBottom = (chatLogEl.scrollHeight - chatLogEl.scrollTop - chatLogEl.clientHeight) < 40;
  chatLogEl.innerHTML = chatMessagesHTML(messages);
  if(wasNearBottom) chatLogEl.scrollTop = chatLogEl.scrollHeight;

  const turnStatusEl = document.getElementById('turnStatus');
  if(turnStatusEl) turnStatusEl.textContent = myTurn ? "It's your turn to speak." : `Waiting on ${turnPlayer?turnPlayer.name:''}…`;

  const chatInputEl = document.getElementById('chatInput');
  const chatSendBtnEl = document.getElementById('chatSendBtn');
  if(chatInputEl){
    chatInputEl.disabled = !myTurn;
    chatInputEl.placeholder = myTurn ? 'Say something…' : 'Not your turn';
  }
  if(chatSendBtnEl) chatSendBtnEl.disabled = !myTurn;

  const clockEl = document.getElementById('liveclock');
  if(clockEl && g.startTime){ clockEl.textContent = fmtClock(g.startTime+g.discussionMs-Date.now()); }

  return true;
}

// Prefer a surgical patch over a full re-render whenever we're already on the
// briefing screen with the chat visible -- a full render() there would destroy
// and recreate the <input>, wiping whatever the current speaker was typing
// and resetting the chat log's scroll position back to the top.
function patchOrRender(){
  if(state.screen==='briefing' && state.game && patchChatUI(state.game)) return;
  render();
}

function render(){
  const app = document.getElementById('app');

  let html = '';
  if(state.toast) html += `<div class="toast">${esc(state.toast)}</div>`;

  if(state.screen==='connect'){
    html += `
      <div class="eyebrow">Classified &middot; Field Exercise</div>
      <h1 class="title" style="font-size:24px;">Connect to the case files</h1>
      <div class="sub">Everyone enters this once per session. It's kept only in this browser tab's memory and is never written to any file or commit.</div>
      <div class="card stack">
        <div>
          <label>Personal access token</label>
          <input type="password" id="ghToken" placeholder="github_pat_... or ghp_...">
          <div class="hint">Get this once from whoever set up the repo — it's a real credential, treat it like a password, not a game code.</div>
        </div>
      </div>
      <button class="btn-primary" id="connectBtn">Connect</button>
      <div class="hint center" style="margin-top:10px;">If this fails, double check the token hasn't expired or been revoked.</div>
    `;
  }

  else if(state.screen==='home'){
    html += `
      <div class="eyebrow">Classified &middot; Field Exercise</div>
      <h1 class="title">FIND THE MOLE</h1>
      <div class="sub">A quick social-deduction game for the team. Everyone gets the same location — except one mole, who has to bluff their way through.</div>
      <div class="card">
        <label>Your codename</label>
        <input type="text" id="nameInput" placeholder="e.g. Kristian" value="${esc(state.name)}" maxlength="24">
      </div>
      <div class="card hot stack">
        <label>Start a new case file</label>
        <div class="hint">You'll get a 4-letter code to share with your team.</div>
        <button class="btn-primary" id="createBtn">Open New Case File</button>
      </div>
      <div class="card stack">
        <label>Join an existing case file</label>
        <input type="text" id="codeInput" class="code-input" placeholder="CODE" maxlength="4">
        <button class="btn-ghost" id="joinBtn" style="border-color:var(--steel);color:var(--paper)">Join Case File</button>
      </div>
      <div class="hint center" style="margin-top:8px;">Each action here (joining, voting, starting rounds) writes a small commit to the game's GitHub repo.</div>
    `;
  }

  else if(state.screen==='lobby'){
    const g = state.game || {};
    const roster = state.roster;
    html += `
      <div class="eyebrow">Case File Open</div>
      <div class="code-display">${esc(state.code)}</div>
      <div class="sub center">Share this code with your team. Everyone joins on their own laptop.</div>
      <div class="card">
        <label>Agents in the room (${roster.length})</label>
        <ul class="manifest">
          ${roster.map((p,i)=>`<li><span class="num">${String(i+1).padStart(3,'0')}</span>${esc(p.name)}${p.id===g.hostId?'<span class="host-tag">HOST</span>':''}${p.id===myId?' <span style="color:var(--gold)">(you)</span>':''}</li>`).join('') || '<li class="hint">Waiting for agents to check in&hellip;</li>'}
        </ul>
      </div>
      ${state.isHost ? `
        <div class="card gold">
          <label>Discussion time</label>
          <div class="row" style="margin-bottom:14px;">
            ${[3,5,8].map(m=>`<button class="${state.discussionMinutes===m?'btn-gold':'btn-ghost'}" onclick="setMinutes(${m})">${m} min</button>`).join('')}
          </div>
          <button class="btn-primary" id="startBtn" ${roster.length<3?'disabled':''}>${roster.length<3?'Need 3+ Agents':'Start Round'}</button>
        </div>
      ` : `<div class="hint center">Waiting for the host to start the round&hellip;</div>`}
      <div class="center" style="margin-top:16px;"><a class="linklike" onclick="leaveToHome()">Leave case file</a></div>
    `;
  }

  else if(state.screen==='briefing'){
    const g = state.game;
    const amSpy = g.spyId===myId;
    const shownWord = amSpy ? (NEAR_MISS[g.word] || g.word) : g.word;
    const inRound = g.players.some(p=>p.id===myId);
    if(!inRound){
      html += `
        <div class="eyebrow">Case File ${esc(state.code)} &middot; Round ${g.round}</div>
        <h1 class="title" style="font-size:22px;">Sit tight, agent.</h1>
        <div class="sub">A round is already underway. You'll be briefed in next round.</div>
      `;
    } else {
      html += `
        <div class="eyebrow">Case File ${esc(state.code)} &middot; Round ${g.round}</div>
        <div class="sub center">Discussion time remaining</div>
        <div class="clock" id="liveclock">${fmtClock(g.startTime+g.discussionMs-Date.now())}</div>
        <div class="folder">
          <div class="folder-tab">FILE No. 0${g.round}</div>
          <div class="folder-body" onclick="declassify()">
            ${state.revealed ? `
              <div class="declassified">
                <div class="role-label">The location is</div>
                <div class="word-big">${esc(shownWord)}</div>
                <div class="hint" style="margin-top:6px;">Ask each other questions about the location without saying it outright. Find whoever doesn't seem to know it.</div>
              </div>
            ` : `
              <div class="stamp-cover">
                <div class="stampmark">CLASSIFIED</div>
                <div class="tapme">Tap to declassify</div>
              </div>
            `}
          </div>
        </div>
        <div class="hint center">Only you can see this card. Keep your device out of view.</div>
        ${renderChat(g)}
        ${state.isHost ? `<button class="btn-ghost" style="margin-top:14px;" onclick="startVoting()">Skip to Voting</button>` : ''}
      `;
    }
  }

  else if(state.screen==='voting'){
    const g = state.game;
    const others = g.players.filter(p=>p.id!==myId);
    const alreadyVoted = state.votedRound===g.round;

    if(alreadyVoted){
      html += `
        <div class="eyebrow">Case File ${esc(state.code)} &middot; Round ${g.round}</div>
        <h1 class="title" style="font-size:24px;">Vote Locked In</h1>
        <div class="sub">${state.votesCount}/${g.players.length} agents have voted.</div>
        <div class="card center" style="padding:30px 20px;">
          <div class="hint" style="font-size:14px;color:var(--paper);">Waiting for the rest of the table&hellip;</div>
        </div>
        ${renderChatHistory(g)}
      `;
    } else {
      html += `
        <div class="eyebrow">Case File ${esc(state.code)} &middot; Round ${g.round}</div>
        <h1 class="title" style="font-size:24px;">Name the Mole</h1>
        <div class="sub">${state.votesCount}/${g.players.length} agents have voted.</div>
        ${renderChatHistory(g)}
        <div class="card">
          <label>Cast Your Suspicion</label>
          <ul class="vote-list">
            ${others.map(p=>`<li><button class="${state.myVote===p.id?'selected':''}" onclick="selectSuspect('${p.id}')"><span>${esc(p.name)}</span><span>${state.myVote===p.id?'&#10003; SELECTED':'SUSPECT'}</span></button></li>`).join('')}
          </ul>
        </div>
        <button class="btn-primary" id="submitVoteBtn" ${state.myVote?'':'disabled'}>Submit Vote</button>
      `;
    }
  }

  else if(state.screen==='results'){
    const g = state.game;
    const {tally,total} = tallyCache;
    let maxVotes = 0;
    Object.values(tally).forEach(v=>{ if(v>maxVotes) maxVotes=v; });
    const topSuspects = Object.keys(tally).filter(id=>tally[id]===maxVotes && maxVotes>0);
    const caught = maxVotes>0 && topSuspects.length===1 && topSuspects[0]===g.spyId;
    const spyName = (g.players.find(p=>p.id===g.spyId)||{}).name || 'Unknown';
    html += `
      <div class="eyebrow">Case File ${esc(state.code)} &middot; Round ${g.round}</div>
      <h1 class="title" style="font-size:24px;">Verdict</h1>
      <div class="folder">
        <div class="folder-tab">DECLASSIFIED</div>
        <div class="folder-body" style="cursor:default;">
          <div class="role-label">The location was</div>
          <div class="word-big">${esc(g.word)}</div>
          <div class="role-label" style="margin-top:14px;">The mole was</div>
          <div class="word-big mole-word">${esc(spyName)}</div>
          <div class="verdict ${caught?'win':'lose'}">${maxVotes===0?'No votes cast':caught?'MOLE CAUGHT':'MOLE ESCAPED'}</div>
        </div>
      </div>
      <div class="card">
        <label>Votes (${total}/${g.players.length})</label>
        ${g.players.map(p=>{
          const v = tally[p.id]||0;
          const pct = total>0 ? Math.round(v/total*100) : 0;
          return `<div class="tally-row"><span style="width:90px;">${esc(p.name)}${p.id===g.spyId?' &#128373;':''}</span><div class="tally-bar"><div class="tally-fill ${p.id===g.spyId?'spy':''}" style="width:${pct}%"></div></div><span style="width:26px;text-align:right;">${v}</span></div>`;
        }).join('')}
      </div>
      ${state.isHost ? `
        <div class="row">
          <button class="btn-primary" onclick="newRound()">New Round</button>
          <button class="btn-ghost" onclick="backToLobby()">Edit Players</button>
        </div>
      ` : `<div class="hint center">Waiting for the host to start the next round&hellip;</div>`}
    `;
  }

  app.innerHTML = html;
  wireHomeEvents();
}

function wireHomeEvents(){
  const ghToken=document.getElementById('ghToken');
  if(ghToken) ghToken.oninput = e=>{ state.ghToken=e.target.value; };
  const connectBtn = document.getElementById('connectBtn');
  if(connectBtn){ connectBtn.onclick = connectToGithub; }

  const nameInput = document.getElementById('nameInput');
  if(nameInput){ nameInput.oninput = e=>{ state.name = e.target.value; }; }
  const createBtn = document.getElementById('createBtn');
  if(createBtn){ createBtn.onclick = createRoom; }
  const joinBtn = document.getElementById('joinBtn');
  const codeInput = document.getElementById('codeInput');
  if(joinBtn && codeInput){ joinBtn.onclick = ()=>joinRoom(codeInput.value); }
  const startBtn = document.getElementById('startBtn');
  if(startBtn){ startBtn.onclick = startGame; }

  const chatInput = document.getElementById('chatInput');
  const chatSendBtn = document.getElementById('chatSendBtn');
  if(chatSendBtn){ chatSendBtn.onclick = handleSendChat; }
  if(chatInput){ chatInput.onkeydown = e=>{ if(e.key==='Enter'){ handleSendChat(); } }; }

  const submitVoteBtn = document.getElementById('submitVoteBtn');
  if(submitVoteBtn){ submitVoteBtn.onclick = submitVote; }
}

async function connectToGithub(){
  const token=(state.ghToken||'').trim();
  if(!token){ setToast('Paste in the token first.'); return; }
  gh = {token};
  try{
    const res = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}`, {
      headers: { Authorization: `Bearer ${token}`, Accept:'application/vnd.github+json' }
    });
    if(res.status===401){ setToast("Bad credentials — that token was rejected. Check it hasn't expired or been revoked."); gh=null; return; }
    if(res.status===404){ setToast('Repo not found — check with whoever set this up.'); gh=null; return; }
    if(!res.ok){ setToast('GitHub error '+res.status+' — check the details and try again.'); gh=null; return; }
  } catch(e){ setToast('Could not reach GitHub: '+e.message); gh=null; return; }
  state.screen='home';
  render();
}

function setMinutes(m){ state.discussionMinutes = m; render(); }
function declassify(){ if(!state.revealed){ state.revealed = true; render(); } }
function leaveToHome(){
  state = {...state, screen:'home', code:'', isHost:false, game:null, roster:[], revealed:false, myVote:null};
  render();
}

window.declassify=declassify; window.setMinutes=setMinutes; window.selectSuspect=selectSuspect; window.submitVote=submitVote;
window.revealResults=revealResults; window.newRound=newRound; window.backToLobby=backToLobby;
window.startVoting=startVoting; window.leaveToHome=leaveToHome;

render();
</script>
